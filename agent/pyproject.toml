[project]
name = "nanexus-video-trust-agent"
version = "0.1.0"
description = "Experimental read-only contracts and core client for the Nanexus Video Trust reference lab."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
